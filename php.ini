; QuizSphere local PHP configuration.
; Start the server with:  php -c php.ini -S localhost:8000  (or start-server.bat)
; because the Windows CLI-server SAPI does NOT pick up an ini automatically.
;
; QuizSphere's SupabaseClient needs curl + openssl to talk to Supabase over
; HTTPS. If your PHP build already loads these extensions elsewhere this file
; is harmless.

extension_dir = "C:\tools\php85\ext"
extension = curl
extension = openssl
extension = mbstring
extension = fileinfo

; Supabase/AI calls retry through transient network failures and can take
; longer than PHP's default 30s; don't kill the script mid-request.
max_execution_time = 120

; PDF upload limit advertised by the app is 10 MB (PHP defaults are 2M/8M,
; which would silently reject normal study PDFs).
upload_max_filesize = 10M
post_max_size = 12M

; TLS trust store used by the bundled Supabase client fallback.
curl.cainfo = "E:\QuizSphere\config\cacert.pem"
openssl.cafile = "E:\QuizSphere\config\cacert.pem"
